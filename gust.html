<!DOCTYPE html>
<html lang="mr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>सदिच्छा भेट</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:linear-gradient(
        135deg,
        #fff5f5,
        #ffffff,
        #fff8e7
    );

    min-height:100vh;
    padding:40px 20px;
    text-align:center;
}

/* Heading */

h2{
    color:#b30000;
    font-size:38px;
    margin-bottom:15px;
    font-weight:bold;

    text-shadow:
        2px 2px 5px rgba(0,0,0,0.15);
}

/* Golden Line */

.heading-line{
    width:120px;
    height:4px;

    background:linear-gradient(
        90deg,
        #b30000,
        #d4af37,
        #b30000
    );

    margin:0 auto 25px;
    border-radius:10px;
}

/* Subtitle */

h3{
    line-height:35px;
    font-weight:normal;
    margin-bottom:35px;
    font-size:22px;
    color:#555;
}


/* ==========================
   Gallery
========================== */

.gallery{

    max-width:1100px;

    margin:auto;

    display:flex;

    justify-content:center;

    gap:25px;

    flex-wrap:nowrap;
}


/* ==========================
   Photo
========================== */

.gallery a{

    width:32%;

    text-decoration:none;

    display:block;

    padding:10px;

    background:linear-gradient(
        145deg,
        #ffffff,
        #fffaf0,
        #fff5f5
    );

    border:2px solid #d4af37;

    border-radius:20px;

    box-shadow:
        0 8px 25px rgba(0,0,0,0.18);

    transition:0.4s;
}


/* Hover */

.gallery a:hover{

    transform:translateY(-10px);

    border-color:#b30000;

    box-shadow:
        0 15px 35px rgba(179,0,0,0.30);
}


/* ==========================
   Image
========================== */

.gallery img{

    width:100%;

    height:300px;

    object-fit:cover;

    display:block;

    border-radius:14px;

    border:4px solid #d4af37;

    transition:0.4s;

}


/* Image Hover */

.gallery a:hover img{

    border-color:#b30000;

    transform:scale(1.02);

    box-shadow:
        0 0 20px rgba(179,0,0,0.30);
}


/* ==========================
   Mobile
========================== */

@media(max-width:700px){

    .gallery{

        flex-wrap:wrap;

    }

    .gallery a{

        width:100%;

        max-width:350px;

    }

    h2{

        font-size:28px;

        line-height:40px;

    }

    h3{

        font-size:18px;

        line-height:30px;

    }

}

</style>

</head>


<body>


<h2>
संत भगवानबाबा अभ्यासिकेला सदिच्छा भेट दिलेल्या व्यक्ती
</h2>


<div class="heading-line"></div>


<h3>

व त्यांच्या काही आठवणींचे फोटो खाली दिले आहेत.

<br>

अधिक पाहण्यासाठी फोटोवर क्लिक करा.

</h3>


<!-- ==========================
     3 Photos In One Row
========================== -->

<div class="gallery">


    <a href="psi1.jpeg" target="_blank">

        <img
            src="psi1.jpeg"
            alt="सदिच्छा भेट फोटो 1"
        >

    </a>


    <a href="psi2.jpeg" target="_blank">

        <img
            src="psi2.jpeg"
            alt="सदिच्छा भेट फोटो 2"
        >

    </a>


    <a href="psi3.jpeg" target="_blank">

        <img
            src="psi3.jpeg"
            alt="सदिच्छा भेट फोटो 3"
        >

    </a>


</div>


</body>

</html>
